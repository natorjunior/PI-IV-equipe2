<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - InfoSuplementos</title>
    <link
    rel="shortcut icon" href="resources/logo2.png" type="image/png">
    <meta name="description" content="InfoSuplementos: Sua fonte confiável sobre pureza de suplementos. Consulte laudos da ABENUTRI e veja aprovados/reprovados.">
    <meta name="keywords" content="suplementos, whey protein, creatina, laudos, abenutri">
    <meta property="og:title" content="InfoSuplementos - Consulte Laudos e Pureza">
    <meta property="og:description" content="Não seja enganado! Verifique se o seu suplemento é puro. Consulte nossa base de dados com laudos técnicos.">
    <meta property="og:image" content="resources/logo.png">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/cadastro.js" defer></script>
  </head>
  <body>
    <main>
      <div class="form-container">
        <h1>Cadastro</h1>
        <!-- MATHEUS: removi o atributo action="login.html; ele faz o navegador ir para login.html mesmo se o js falhar" -->
        <form id="form-cadastro">
          <div class="input-group">
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Nome completo"
              required
            />
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="input-group">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
            <i class="fa-solid fa-envelope"></i>
          </div>
          <div class="input-group">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Senha"
              required
            />
            <i class="fa-solid fa-lock"></i>
          </div>
          <div class="input-group">
            <input
              type="password"
              id="confirmar-senha"
              name="confirmar-senha"
              placeholder="Confirmar Senha"
              required
            />
            <i class="fa-solid fa-lock"></i>
          </div>
          <button type="submit">Cadastrar</button>
          <div class="links">
            <p>Já tem uma conta? <a href="login.html">Faça o login</a>.</p>
          </div>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2025 InfoSuplementos - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
